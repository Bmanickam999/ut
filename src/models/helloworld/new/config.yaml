run:
  name: helloworld-after
  seed: 42
  output_dir: artifacts/helloworld-after

model:
  factory: models.helloworld.new.factory:build_model
  input_size: 10
  hidden_size: 10
  output_size: 5

data:
  factory: models.helloworld.new.factory:build_datasets
  # Leadership-scale demonstration; override with --set data.num_examples=10000 for a quick run.
  num_examples: 1000000
  validation_fraction: 0.2
  input_size: 10
  output_size: 5

trainer:
  max_epochs: 5
  train_batch_size: 4096
  eval_batch_size: 4096
  gradient_accumulation_steps: 1
  learning_rate: 0.01
  weight_decay: 0.0
  optimizer:
    name: sgd
    parameters: {lr: 0.01, momentum: 0.0, weight_decay: 0.0}
  scheduler:
    # Match the learning-rate behavior hard-coded in helloworld-before.
    name: constant
    warmup_steps: 0
  max_grad_norm: 100.0
  precision: fp32
  compile: false
  num_workers: 0
  log_every_steps: 50
  telemetry: {enabled: true, log_every_steps: 50}
  save_every_epochs: 1
  resume_from: null
  early_stopping: {metric: val_loss, mode: min, patience: 3, min_delta: 0.0}
  safety: {stop_on_non_finite_loss: true, max_loss: 100.0, max_consecutive_skips: 1}
