run: {name: starter, seed: 42, output_dir: artifacts/starter}
model:
  factory: models.helloworld.new.factory:build_model
  input_size: 10
  hidden_size: 10
  output_size: 5
data:
  factory: models.helloworld.new.factory:build_datasets
  num_examples: 128
  validation_fraction: 0.2
  input_size: 10
  output_size: 5
trainer:
  environment:
    override_existing: false
    variables:
      NCCL_DEBUG: INFO
      NCCL_DEBUG_SUBSYS: INIT,COLL
      TORCH_DISTRIBUTED_DEBUG: INFO
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      TORCH_SHOW_CPP_STACKTRACES: "1"
  model_parallelism:
    name: none
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    data_parallel_size: auto
  max_epochs: 2
  train_batch_size: 16
  eval_batch_size: 16
  gradient_accumulation_steps: 1
  optimizer:
    name: adamw
    parameters: {lr: 0.001, weight_decay: 0.01}
  warmup_steps: 0
  max_grad_norm: 1.0
  precision: fp32
  compile: false
  num_workers: 0
  log_every_steps: 1
  telemetry: {enabled: true, log_every_steps: 1}
  diagnostics: {enabled: false, log_every_batches: 1, collective_timeout_seconds: 120, fail_fast_capacity_check: false}
  save_every_epochs: 1
  resume_from: null
  early_stopping: {metric: val_loss, mode: min, patience: 3, min_delta: 0.0}
  safety: {stop_on_non_finite_loss: true, max_loss: 100.0, max_consecutive_skips: 1}
