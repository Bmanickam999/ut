run:
  name: housing-llm-500m
  seed: 42
  output_dir: artifacts/housing-llm-500m

model:
  factory: models.housing_llm.factory:build_model
  vocab_size: 32000
  max_seq_len: 256
  d_model: 1024
  n_layers: 37
  n_heads: 16
  d_ff: 4096
  dropout: 0.1
  target_mean: 300000.0
  target_scale: 200000.0

data:
  factory: models.housing_llm.factory:build_datasets
  source:
    type: synthetic              # change to csv or url_csv; no bank dependency
    path: null                   # local path or public HTTPS URL
    cache_dir: .cache/public-data
  num_examples: 100000
  validation_fraction: 0.1
  feature_fields: [state, county, bedrooms, bathrooms, living_area_sqft, median_income, population, year_built]
  target_field: home_value
  tokenizer:
    vocab_size: 32000
    max_length: 256

trainer:
  environment:
    override_existing: false
    variables:
      NCCL_DEBUG: INFO
      NCCL_DEBUG_SUBSYS: INIT,COLL
      TORCH_DISTRIBUTED_DEBUG: INFO
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      TORCH_SHOW_CPP_STACKTRACES: "1"
  model_parallelism:
    name: none  # none => ordinary DDP only when launched with multiple ranks
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    data_parallel_size: auto
  max_epochs: 10
  train_batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.1
  optimizer:
    name: adamw
    parameters:
      lr: 0.0002
      weight_decay: 0.1
      betas: [0.9, 0.95]
      eps: 1.0e-8
  warmup_steps: 500
  max_grad_norm: 1.0
  precision: bf16              # bf16, fp16, fp32, or auto
  compile: false
  num_workers: 4
  log_every_steps: 20
  telemetry:
    enabled: true
    log_every_steps: 20
  diagnostics:
    enabled: false
    log_every_batches: 1
    collective_timeout_seconds: 1800
    fail_fast_capacity_check: false
    capacity: {bytes_per_parameter: 20.0, activation_reserve_gib: 4.0, max_memory_fraction: 0.9, require_memory_check: true}
  save_every_epochs: 1
  resume_from: null
  early_stopping:
    metric: val_loss
    mode: min
    patience: 3
    min_delta: 0.0001
  safety:
    stop_on_non_finite_loss: true
    max_loss: 100.0            # exploding-loss circuit breaker
    max_consecutive_skips: 2
